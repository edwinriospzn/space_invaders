services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space_invaders_jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # Grants the `jenkins` user access to the bind-mounted Docker socket
    # without running the container as root. Set DOCKER_GID to the host's
    # `docker` group gid (`getent group docker | cut -d: -f3`) — it varies
    # per host, so there's no safe default to bake in.
    group_add:
      - "${DOCKER_GID}"
    # `docker compose up` in the Jenkinsfile talks to the *host's* Docker
    # daemon via the socket mount above (DooD), so it publishes the app
    # stack's ports on the host's network interfaces, not this container's.
    # `localhost` inside this container is its own loopback, where nothing
    # is listening — reach published ports via the host gateway instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Test database the backend pytest suite runs against (see Jenkinsfile's
  # "pytest" stage) — separate from the app's own Postgres in
  # infrastructure/docker/, so CI runs never touch real data.
  postgres:
    image: postgres:17
    container_name: jenkins_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: space_invaders
      POSTGRES_PASSWORD: space_invaders
      POSTGRES_DB: space_invaders
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "space_invaders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  jenkins_home:
