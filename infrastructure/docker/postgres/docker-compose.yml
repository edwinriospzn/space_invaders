services:
  postgres:
    image: postgres:17
    container_name: space_invaders_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: space_invaders
      POSTGRES_PASSWORD: space_invaders
      POSTGRES_DB: space_invaders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
